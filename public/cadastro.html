<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Virando a Folha | Brinquedoteca Barreiro</title>
  <link rel="icon" type="image/svg+xml" href="assets/comum/img/favicon.svg">
  <link rel="stylesheet" href="assets/cadastro/css/estilo.css">
</head>
<body class="carregando" data-pagina="cadastro">
  <main class="conteudo">
    <header class="cabecalho-pagina">
      <div>
        <h1 id="titulo">Novo cadastro</h1>
        <p class="subtitulo" id="subtitulo">Cadastre o responsável e as crianças de uma vez.</p>
      </div>
      <div class="acoes"><a class="btn btn-suave" href="clientes.html">Voltar para clientes</a></div>
    </header>

    <form id="formulario" novalidate>
      <input type="hidden" id="cod_responsavel">

      <section class="cartao" aria-labelledby="tResp">
        <div class="cartao-cabecalho"><div><h2 id="tResp">Responsável</h2><p>Quem assina e responde pelas crianças.</p></div></div>
        <div class="grade-form">
          <label class="campo c4"><span>CPF</span><input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></label>
          <label class="campo c4"><span>Primeiro nome</span><input type="text" id="primeiro_nome" autocomplete="off" required></label>
          <label class="campo c4"><span>Sobrenome</span><input type="text" id="sobrenome" autocomplete="off" required></label>
          <label class="campo c4"><span>Sexo</span>
            <select id="sexo" required><option value="">Escolha</option><option value="F">Feminino</option><option value="M">Masculino</option><option value="O">Outro</option></select>
          </label>
          <label class="campo c4"><span>Data de nascimento</span><input type="date" id="data_nascimento" max="" required></label>
          <label class="campo c4"><span>Telefones</span><input type="text" id="telefones" inputmode="tel" placeholder="(31) 98888-0001, (31) 3333-0001"><small>Separe vários por vírgula.</small></label>
          <label class="campo c6"><span>Rua</span><input type="text" id="rua" required></label>
          <label class="campo c2"><span>Número</span><input type="text" id="numero" required></label>
          <label class="campo c4"><span>Bairro</span><input type="text" id="bairro" required></label>
          <label class="campo c6"><span>Cidade</span><input type="text" id="cidade" value="Belo Horizonte" required></label>
        </div>
      </section>

      <section class="cartao" aria-labelledby="tCrian">
        <div class="cartao-cabecalho">
          <div><h2 id="tCrian">Crianças</h2><p>Todas as crianças que vão frequentar a brinquedoteca com este responsável.</p></div>
          <button type="button" class="btn btn-suave" id="botaoAddCrianca">Adicionar criança</button>
        </div>
        <div id="criancas"></div>
      </section>

      <div class="rodape-form">
        <button type="submit" class="btn btn-primario btn-grande" id="botaoSalvar">Salvar cadastro</button>
        <a class="btn btn-suave btn-grande" href="clientes.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="assets/comum/js/util.js"></script>
  <script src="assets/comum/js/logo.js"></script>
  <script src="assets/comum/js/layout.js"></script>
  <script src="assets/cadastro/js/script.js"></script>
</body>
</html>
