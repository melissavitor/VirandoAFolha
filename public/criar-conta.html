<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Virando a Folha | Brinquedoteca Barreiro</title>
  <link rel="icon" type="image/svg+xml" href="assets/comum/img/favicon.svg">
  <link rel="stylesheet" href="assets/criar-conta/css/estilo.css">
</head>
<body>
  <div class="entrada">
    <section class="entrada-marca" aria-label="Brinquedoteca Barreiro">
      <div class="miolo">
        <div id="logoCasa"></div>
        <div id="logoPalavra"></div>
        <p class="lema">ONDE BRINCAR É COISA SÉRIA</p>
        <p class="projeto">Área do responsável</p>
        <p class="subtitulo">Cadastre suas crianças e peça o orçamento da festa sem sair de casa.</p>
      </div>
    </section>

    <main class="entrada-form">
      <form class="entrada-cartao conta-cartao" id="formulario" novalidate>
        <div>
          <h1>Criar conta</h1>
          <p class="subtitulo">Depois de criar, você cadastra as crianças e pode pedir um evento.</p>
        </div>

        <div id="erro" class="aviso erro" role="alert" hidden></div>

        <div class="grade-form">
          <label class="campo c12"><span>CPF</span><input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="username" required></label>
          <label class="campo c6"><span>Primeiro nome</span><input type="text" id="primeiro_nome" autocomplete="given-name" required></label>
          <label class="campo c6"><span>Sobrenome</span><input type="text" id="sobrenome" autocomplete="family-name" required></label>
          <label class="campo c6"><span>Sexo</span>
            <select id="sexo" required><option value="">Escolha</option><option value="F">Feminino</option><option value="M">Masculino</option><option value="O">Outro</option></select>
          </label>
          <label class="campo c6"><span>Data de nascimento</span><input type="date" id="data_nascimento" required></label>
          <label class="campo c12"><span>Telefones</span><input type="text" id="telefones" inputmode="tel" placeholder="(31) 98888-0001"><small>Separe vários por vírgula.</small></label>
          <label class="campo c8"><span>Rua</span><input type="text" id="rua" autocomplete="address-line1" required></label>
          <label class="campo c4"><span>Número</span><input type="text" id="numero" required></label>
          <label class="campo c6"><span>Bairro</span><input type="text" id="bairro" required></label>
          <label class="campo c6"><span>Cidade</span><input type="text" id="cidade" value="Belo Horizonte" required></label>
          <label class="campo c6"><span>Senha</span><input type="password" id="senha" minlength="6" autocomplete="new-password" required><small>Pelo menos 6 caracteres.</small></label>
          <label class="campo c6"><span>Repita a senha</span><input type="password" id="senha2" autocomplete="new-password" required></label>
        </div>

        <button type="submit" class="btn btn-primario btn-grande btn-bloco" id="botaoCriar">Criar conta</button>
        <p class="link-conta">Já tem conta? <a href="login.html">Entrar</a></p>
      </form>
    </main>
  </div>

  <script src="assets/comum/js/util.js"></script>
  <script src="assets/comum/js/logo.js"></script>
  <script src="assets/criar-conta/js/script.js"></script>
</body>
</html>
