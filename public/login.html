<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Virando a Folha | Brinquedoteca Barreiro</title>
  <link rel="icon" type="image/svg+xml" href="assets/comum/img/favicon.svg">
  <link rel="stylesheet" href="assets/login/css/estilo.css">
</head>
<body>
  <div class="entrada">
    <section class="entrada-marca" aria-label="Brinquedoteca Barreiro">
      <div class="miolo">
        <div id="logoCasa"></div>
        <div id="logoPalavra"></div>
        <p class="lema">ONDE BRINCAR É COISA SÉRIA</p>
        <p class="projeto">Virando a Folha</p>
        <p class="subtitulo">Do papel ao digital, porque brincar é coisa séria.</p>
      </div>
    </section>

    <main class="entrada-form">
      <form class="entrada-cartao" id="formulario" autocomplete="on">
        <div>
          <h1>Bem-vindo de volta</h1>
          <p class="subtitulo">Equipe e responsáveis entram com o CPF e a senha.</p>
        </div>

        <div id="erro" class="aviso erro" role="alert" hidden></div>

        <label class="campo">
          <span>CPF</span>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="username" required autofocus>
        </label>
        <label class="campo">
          <span>Senha</span>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </label>

        <button type="submit" class="btn btn-primario btn-grande btn-bloco" id="botaoEntrar">Entrar</button>

        <p class="link-conta">É responsável por uma criança? <a href="criar-conta.html">Crie sua conta</a></p>

        <div class="dica">
          <p>Para testar, entre com o CPF de qualquer funcionário. Senha de todos: <strong>folha123</strong></p>
          <ul class="lista-teste">
            <li><button type="button" data-cpf="222.333.444-01">Beatriz, coordenação <span>222.333.444-01</span></button></li>
            <li><button type="button" data-cpf="222.333.444-02">João, recepção <span>222.333.444-02</span></button></li>
            <li><button type="button" data-cpf="222.333.444-03">Camila, monitora <span>222.333.444-03</span></button></li>
            <li><button type="button" data-cpf="222.333.444-04">Rafael, monitor <span>222.333.444-04</span></button></li>
          </ul>
        </div>
      </form>
    </main>
  </div>

  <script src="assets/comum/js/util.js"></script>
  <script src="assets/comum/js/logo.js"></script>
  <script src="assets/login/js/script.js"></script>
</body>
</html>
